services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-digital_marketplace}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-6006}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: